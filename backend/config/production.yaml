logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: json

server:
  port: 3000
  binding: 0.0.0.0
  host: <%= get_env(name="APP_PUBLIC_URL", default="http://localhost") %>
  middlewares:
    static:
      enable: true
      must_exist: false
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

workers:
  mode: BackgroundAsync

mailer:
  smtp:
    enable: true
    host: <%= get_env(name="SMTP_HOST", default="localhost") %>
    port: <%= get_env(name="SMTP_PORT", default="465") %>
    secure: true

database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 500
  min_connections: 1
  max_connections: 10
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: <%= get_env(name="JWT_SECRET") %>
    expiration: 3600
