logger:
  enable: true
  pretty_backtrace: true
  level: info
  format: compact

server:
  port: 3000
  binding: 0.0.0.0
  host: http://localhost
  middlewares:
    static:
      # Disabled: the SPA + uploads are served by explicit controller
      # routes (controllers::spa), mirroring the old Express tail.
      # Leaving this enabled nests a second static handler that
      # answers deep links with 404.
      enable: false
      must_exist: false
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

workers:
  mode: BackgroundAsync

mailer:
  smtp:
    enable: false
    host: localhost
    port: 1025
    secure: false

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://contact:contact@db:5432/contact_system") %>
  enable_logging: false
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="10") %>
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: <%= get_env(name="JWT_SECRET", default="dev-only-secret-change-me-32chars!!") %>
    expiration: 3600
