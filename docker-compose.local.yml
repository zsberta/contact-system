services:
  db:
    image: pgvector/pgvector:pg16
    container_name: contact-system-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: contact_system
      POSTGRES_USER: contact
      # Override in your real .env or via Docker secrets. The literal below is the local dev default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Postgres is bound to the internal Docker network only — not exposed to the host.
    # To run psql from the host for debugging, use:
    #   docker exec -it contact-system-db psql -U contact -d contact_system
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Read-only backups mount so a dump can be restored with a single
      # `docker exec ... pg_restore /backups/...` (see ops/pgbackup/README.md).
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact -d contact_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Read-only Docker Engine API proxy for the admin Server info page.
  # Only this service touches /var/run/docker.sock; the app talks to
  # the proxy over the internal compose network (DOCKER_PROXY_URL).
  # POST is 0 globally, so the app can never create/start/stop/exec —
  # strictly read-only. No `ports:` — unreachable from outside.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.1
    container_name: contact-system-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      INFO: 1
      SYSTEM: 1
      POST: 0

  # Full PostgreSQL dump every 10 minutes + tiered prune (every dump
  # kept for 24h, then 2/day for 30 days). Writes to ./backups
  # (gitignored). Starts with `docker compose up -d --build`.
  # See ops/pgbackup/README.md for policy + restore.
  pgbackup:
    image: pgvector/pgvector:pg16
    container_name: contact-system-pgbackup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_DB: contact_system
      POSTGRES_USER: contact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_SECS: ${BACKUP_INTERVAL_SECS:-600}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_MAX_SIZE_MB: ${BACKUP_MAX_SIZE_MB:-2048}
    volumes:
      - ./backups:/backups
      - ./ops/pgbackup:/opt/pgbackup:ro
    command: ["bash", "/opt/pgbackup/backup-loop.sh"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contact-system-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:3000"
    environment:
      # This compose file is for LOCAL DEVELOPMENT, not production.
      # LOCO_ENV=development skips the DATABASE_SSL / COOKIE_SECURE guards.
      LOCO_ENV: development
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://contact:${POSTGRES_PASSWORD}@db:5432/contact_system
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_ACCESS_TTL: "3600"
      JWT_REFRESH_TTL: "604800"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      COOKIE_SECURE: "false"
      BCRYPT_COST: "12"
      # Read-only Docker Engine API proxy (socket-proxy service above).
      DOCKER_PROXY_URL: http://socket-proxy:2375
      # nexus-gateway billing API (admin Billing page proxy). Token comes
      # from the gateway's `gateway:client-create`; the browser never sees it.
      GATEWAY_API_URL: ${GATEWAY_API_URL:-http://host.docker.internal:9006/api/v1}
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:-}
    env_file:
      - .env
    # Persistent storage for blog cover/inline images. Without this
    # bind mount, files written into /app/uploads by the blog
    # attachment route disappear every time the image is rebuilt
    # (`docker compose up --build`) — the DB row keeps the old URL,
    # but the file on disk is gone, so the image renders as a
    # broken link. The mount is read-write so the nodeapp user
    # (uid 1000 inside the container) can write into the directory.
    volumes:
      - ./uploads:/app/uploads
      # Landing rebuild trigger directory. The CRM writes .flag files
      # here on blog publish/unpublish/delete. The host-side watcher
      # script (scripts/landing-rebuild-watcher.sh --foreground) polls
      # this directory and runs the per-project build command.
      - ./.landing-flags:/var/triggers/landing-rebuild
    # NOTE: the admin seed is idempotent (only inserts when the DB is
    # empty) and runs inside the entrypoint, so `up --build` never
    # duplicates data. Migrations are embedded in the binary.
    command: ["/app/entrypoint.sh"]

volumes:
  pgdata:

networks:
  default:
    driver: bridge
